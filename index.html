<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#008080" />
    <meta
      name="description"
      content="GYMMI – ein kleiner, lokaler Workout-Tracker im Windows-98-Look."
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <title>GYMMI.EXE</title>
  </head>
  <body>
    <div class="desktop">
      <div class="app-window" role="application" aria-label="GYMMI Workout Tracker">
        <header class="title-bar">
          <div class="title-bar__title">
            <span class="app-icon" aria-hidden="true">G</span>
            <span>GYMMI.EXE</span>
          </div>
          <div class="window-controls" aria-hidden="true">
            <span>_</span><span>□</span><span>×</span>
          </div>
        </header>

        <nav class="tabs" aria-label="Hauptnavigation">
          <button class="tab is-active" type="button" data-view="workout">Workout</button>
          <button class="tab" type="button" data-view="exercises">Übungen</button>
          <button class="tab" type="button" data-view="history">Verlauf</button>
        </nav>

        <main id="app" class="app-content" tabindex="-1"></main>

        <footer class="status-bar">
          <span class="status-bar__panel" id="storage-status">LOKAL GESPEICHERT</span>
          <span class="status-bar__panel status-bar__clock" id="clock">--:--</span>
        </footer>
      </div>
    </div>

    <dialog class="win-dialog" id="exercise-picker" aria-labelledby="picker-title">
      <form method="dialog" class="dialog-window">
        <header class="title-bar">
          <strong id="picker-title">Übung hinzufügen</strong>
          <button class="window-close" value="cancel" aria-label="Fenster schließen">×</button>
        </header>
        <div class="dialog-content">
          <label class="field-label" for="exercise-search">Suchen:</label>
          <input id="exercise-search" class="win-input" type="search" autocomplete="off" />
          <div id="picker-groups" class="filter-row" aria-label="Nach Muskelgruppe filtern"></div>
          <div id="picker-list" class="picker-list"></div>
          <button class="win-button win-button--wide" id="create-from-picker" type="button">
            + Eigene Übung erstellen
          </button>
        </div>
      </form>
    </dialog>

    <dialog class="win-dialog" id="new-exercise-dialog" aria-labelledby="new-exercise-title">
      <form class="dialog-window" id="new-exercise-form">
        <header class="title-bar">
          <strong id="new-exercise-title">Neue Übung</strong>
          <button class="window-close" type="button" data-close-dialog="new-exercise-dialog" aria-label="Fenster schließen">×</button>
        </header>
        <div class="dialog-content form-stack">
          <div>
            <label class="field-label" for="new-exercise-name">Name</label>
            <input
              id="new-exercise-name"
              class="win-input"
              name="name"
              required
              maxlength="42"
              placeholder="z. B. Schrägbankdrücken"
              autocomplete="off"
            />
          </div>
          <div>
            <label class="field-label" for="new-exercise-group">Muskelgruppe</label>
            <select id="new-exercise-group" class="win-input" name="group" required></select>
          </div>
          <div class="dialog-actions">
            <button class="win-button" type="button" data-close-dialog="new-exercise-dialog">Abbrechen</button>
            <button class="win-button win-button--primary" type="submit">Speichern</button>
          </div>
        </div>
      </form>
    </dialog>

    <dialog class="win-dialog confirm-dialog" id="finish-dialog" aria-labelledby="finish-title">
      <form method="dialog" class="dialog-window">
        <header class="title-bar">
          <strong id="finish-title">Workout abschließen</strong>
          <button class="window-close" value="cancel" aria-label="Fenster schließen">×</button>
        </header>
        <div class="dialog-content">
          <div class="message-box">
            <span class="message-icon" aria-hidden="true">?</span>
            <p>Workout speichern und beenden?</p>
          </div>
          <div class="dialog-actions">
            <button class="win-button" value="cancel">Abbrechen</button>
            <button class="win-button win-button--primary" id="confirm-finish" value="default">Ja, speichern</button>
          </div>
        </div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="app.js" defer></script>
  </body>
</html>
